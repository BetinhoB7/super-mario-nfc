<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000">
<title>Super Mario</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111;z-index:10;text-align:center}
h1{color:#fff;font-size:34px;margin:0 0 25px}
button{border:0;border-radius:16px;padding:20px 34px;font-size:24px;font-weight:700;background:#e52521;color:#fff;box-shadow:0 6px 0 #8f1110}
#hint{color:#bbb;margin-top:22px;font-size:14px;max-width:300px}
</style>
</head>
<body>
<div id="start">
  <h1>🎮 SUPER MARIO</h1>
  <button id="play">JOGAR MARIO</button>
  <div id="hint">Ao tocar, tentaremos abrir o jogo em tela cheia e na horizontal.</div>
</div>

<script>
const gameURL = "https://www.smbgames.be/super-mario-for-snes.php";

async function fullscreen(){
  try {
    if(document.documentElement.requestFullscreen)
      await document.documentElement.requestFullscreen();
  } catch(e){}
  try {
    if(screen.orientation && screen.orientation.lock)
      await screen.orientation.lock("landscape");
  } catch(e){}
}

document.getElementById("play").addEventListener("click", async ()=>{
  await fullscreen();
  // Abre o SMBGames diretamente, evitando bloqueio de iframe.
  window.location.href = gameURL;
});
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Super Mario</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;z-index:10}
  button{border:0;border-radius:16px;padding:20px 34px;font-size:24px;font-weight:700;background:#e52521;color:#fff;box-shadow:0 6px 0 #8f1110}
  #game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#000}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;color:#fff;background:#000b;padding:8px 12px;border-radius:10px;font-size:13px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div id="start">
  <button id="play">🎮 JOGAR MARIO</button>
</div>

<iframe id="game"
  src="https://www.smbgames.be/super-mario-for-snes.php"
  allow="fullscreen; autoplay; gamepad"
  allowfullscreen
  class="hidden"></iframe>

<div id="hint" class="hidden">Gire o celular na horizontal</div>

<script>
const start=document.getElementById('start');
const game=document.getElementById('game');
const hint=document.getElementById('hint');

async function goFullscreen(){
  try {
    if (document.documentElement.requestFullscreen)
      await document.documentElement.requestFullscreen();
  } catch(e) {}
  try {
    if (screen.orientation && screen.orientation.lock)
      await screen.orientation.lock('landscape');
  } catch(e) {}
}

document.getElementById('play').addEventListener('click', async ()=>{
  start.classList.add('hidden');
  game.classList.remove('hidden');
  hint.classList.remove('hidden');
  await goFullscreen();
  setTimeout(()=>hint.classList.add('hidden'),3500);
});

document.addEventListener('fullscreenchange', ()=>{
  if (!document.fullscreenElement) {
    // O navegador pode sair do fullscreen; o jogo continua funcionando.
  }
});
</script>
</body>
</html>

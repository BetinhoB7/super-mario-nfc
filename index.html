<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
<link rel="dns-prefetch" href="//cdn.emulatorjs.org">
<title>Mario Genérico</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%}
#loading{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center}
.card{width:min(90vw,430px);padding:28px}.logo{font-size:44px}.title{font-size:29px;font-weight:800;margin-top:8px}.sub{font-size:15px;color:#aaa;margin-top:10px}.bar{height:9px;background:#222;border-radius:20px;margin-top:24px;overflow:hidden}.bar i{display:block;width:35%;height:100%;background:#e52521;animation:load 1.1s infinite ease-in-out}@keyframes load{0%{transform:translateX(-130%)}100%{transform:translateX(330%)}}.hidden{display:none!important}
</style>
</head>
<body>
<div id="loading"><div class="card"><div class="logo">🎮</div><div class="title">MARIO GENÉRICO</div><div class="sub" id="status">Iniciando...</div><div class="bar"><i></i></div></div></div>
<div id="game"></div>
<script>
window.EJS_player="#game";
window.EJS_core="snes9x";
window.EJS_gameUrl="./Mario%20Generico.smc";
window.EJS_gameName="Mario Generico";
window.EJS_pathtodata="https://cdn.emulatorjs.org/4.2.3/data/";
window.EJS_startOnLoaded=true;
window.EJS_fullscreenOnLoaded=true;
window.EJS_controlScheme="snes";
window.EJS_volume=1;
window.EJS_cacheConfig={enabled:true,cacheMaxSizeMB:4096,cacheMaxAgeMins:43200};
const status=document.getElementById("status"),loading=document.getElementById("loading");
const s=document.createElement("script");
s.src="https://cdn.emulatorjs.org/4.2.3/data/loader.js";
s.onload=()=>status.textContent="Carregando o jogo...";
s.onerror=()=>status.textContent="Erro ao carregar o emulador.";
document.body.appendChild(s);
const check=setInterval(()=>{if(document.querySelector("#game canvas")){clearInterval(check);setTimeout(()=>loading.classList.add("hidden"),400)}},200);
</script>
</body>
</html>

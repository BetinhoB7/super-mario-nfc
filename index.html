<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>Mario Genérico</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;overflow:hidden}
#game{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#loading{
  position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:#050505;color:#fff;font-family:Arial,sans-serif;text-align:center;
  transition:opacity .35s ease;
}
.card{width:min(90vw,430px);padding:30px 22px}
.logo{font-size:42px;margin-bottom:8px}
.title{font-size:30px;font-weight:800;letter-spacing:.5px}
.sub{font-size:16px;color:#bbb;margin-top:10px}
.bar{width:100%;height:10px;background:#242424;border-radius:99px;margin-top:25px;overflow:hidden}
.bar i{display:block;width:35%;height:100%;background:#e52521;border-radius:99px;animation:load 1.35s infinite ease-in-out}
@keyframes load{0%{transform:translateX(-120%)}100%{transform:translateX(310%)}}
.tip{font-size:13px;color:#777;margin-top:18px}
.hidden{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="loading">
  <div class="card">
    <div class="logo">🎮</div>
    <div class="title">MARIO GENÉRICO</div>
    <div class="sub" id="status">Preparando o jogo...</div>
    <div class="bar"><i></i></div>
    <div class="tip">Não feche esta tela enquanto o jogo carrega.</div>
  </div>
</div>

<div id="game"></div>

<script>
window.EJS_player="#game";
window.EJS_core="snes";
window.EJS_gameUrl="Mario%20Generico.smc";
window.EJS_gameName="Mario Generico";
window.EJS_pathtodata="https://cdn.emulatorjs.org/stable/data/";
window.EJS_startOnLoaded=true;
window.EJS_fullscreenOnLoaded=true;
window.EJS_controlScheme="snes";
window.EJS_volume=1;

const status=document.getElementById("status");
const loading=document.getElementById("loading");

let messages=["Preparando o jogo...","Carregando o emulador...","Carregando Mario..."];
let n=0;
setInterval(()=>{ if(n<messages.length-1){n++;status.textContent=messages[n];}},900);

window.addEventListener("load",()=>{
  const s=document.createElement("script");
  s.src="https://cdn.emulatorjs.org/stable/data/loader.js";
  s.onload=()=>{status.textContent="Iniciando Mario...";};
  s.onerror=()=>{status.textContent="Não foi possível carregar o emulador.";};
  document.body.appendChild(s);
});

const observer=new MutationObserver(()=>{
  const canvas=document.querySelector("#game canvas");
  if(canvas){
    setTimeout(()=>loading.classList.add("hidden"),700);
    observer.disconnect();
  }
});
observer.observe(document.body,{childList:true,subtree:true});
</script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Super Mario World</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:Arial,sans-serif}
  #setup{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#000;padding:24px;box-sizing:border-box}
  h1{color:#fff;font-size:32px;margin:0 0 12px}
  p{color:#ccc;max-width:420px;line-height:1.45}
  button,label{border:0;border-radius:14px;padding:16px 24px;font-size:19px;font-weight:700;background:#e52521;color:#fff;cursor:pointer;display:inline-block}
  input{display:none}
  #play{display:none}
  #status{font-size:14px;color:#aaa;margin-top:15px}
  #game{position:fixed;inset:0;width:100%;height:100%;z-index:1}
  #change{position:fixed;right:10px;top:10px;z-index:30;background:#000b;color:#fff;border:1px solid #555;padding:8px 12px;border-radius:10px;font-size:12px}
</style>
</head>
<body>
<div id="setup">
  <h1>🎮 SUPER MARIO WORLD</h1>
  <p id="message">Na primeira vez, selecione a sua ROM <b>.smc</b> ou <b>.sfc</b>. Ela ficará armazenada somente neste navegador.</p>
  <label id="choose" for="rom">Escolher ROM</label>
  <input id="rom" type="file" accept=".smc,.sfc,application/octet-stream">
  <button id="play">▶ JOGAR</button>
  <div id="status"></div>
</div>

<div id="game"></div>
<button id="change" style="display:none">Trocar ROM</button>

<script>
const DB_NAME='mario-nfc-db', STORE='roms', KEY='super-mario-world';
let romBlob=null, emulatorStarted=false;

function openDB(){
  return new Promise((resolve,reject)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
    r.onsuccess=()=>resolve(r.result);
    r.onerror=()=>reject(r.error);
  });
}
async function saveRom(file){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readwrite');
    tx.objectStore(STORE).put(file,KEY);
    tx.oncomplete=resolve;
    tx.onerror=()=>reject(tx.error);
  });
}
async function getRom(){
  const db=await openDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).get(KEY);
    r.onsuccess=()=>resolve(r.result||null);
    r.onerror=()=>reject(r.error);
  });
}
async function fullscreen(){
  try{ if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); }catch(e){}
  try{ if(screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape'); }catch(e){}
}
function startEmulator(blob){
  if(emulatorStarted) return;
  emulatorStarted=true;
  const url=URL.createObjectURL(blob);
  window.EJS_player='#game';
  window.EJS_core='snes';
  window.EJS_gameUrl=url;
  window.EJS_pathtodata='https://cdn.emulatorjs.org/stable/data/';
  window.EJS_gameName='Super Mario World';
  window.EJS_gameID=1;
  window.EJS_fullscreenOnLoaded=true;
  window.EJS_startOnLoaded=true;
  window.EJS_controlScheme='snes';
  window.EJS_volume=1;
  const s=document.createElement('script');
  s.src='https://cdn.emulatorjs.org/stable/data/loader.js';
  document.body.appendChild(s);
  document.getElementById('setup').style.display='none';
  document.getElementById('change').style.display='block';
}
async function prepare(){
  const saved=await getRom();
  if(saved){
    romBlob=saved;
    document.getElementById('message').textContent='Sua ROM já está salva neste navegador. Toque em JOGAR para iniciar.';
    document.getElementById('choose').style.display='none';
    document.getElementById('play').style.display='inline-block';
    document.getElementById('status').textContent='ROM pronta para jogar.';
  }
}
document.getElementById('rom').addEventListener('change',async e=>{
  const file=e.target.files[0];
  if(!file) return;
  if(!/\.s(mc|fc)$/i.test(file.name)){
    document.getElementById('status').textContent='Escolha um arquivo .smc ou .sfc.';
    return;
  }
  await saveRom(file);
  romBlob=file;
  document.getElementById('message').textContent='ROM salva neste navegador. Agora toque em JOGAR.';
  document.getElementById('choose').style.display='none';
  document.getElementById('play').style.display='inline-block';
  document.getElementById('status').textContent=file.name+' salva localmente.';
});
document.getElementById('play').addEventListener('click',async()=>{
  if(!romBlob) return;
  await fullscreen();
  startEmulator(romBlob);
});
document.getElementById('change').addEventListener('click',()=>{
  location.reload();
});
prepare().catch(()=>{});
</script>
</body>
</html>
